<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <radialGradient id="canopyGlow" cx="50%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
  </defs>

  <!-- Rounded badge background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#a5b4fc" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Subtle canopy aura so silhouette reads as a lush tree at 16x16 -->
  <circle cx="32" cy="25" r="20" fill="url(#canopyGlow)" />

  <!-- Genealogical pedigree branches & trunk -->
  <g fill="none" stroke="url(#trunkGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main trunk -->
    <path d="M32 49 V33" stroke-width="4.5" />
    <!-- Root flares -->
    <path d="M23 51 C28 51 32 48 32 43" stroke-width="3.2" />
    <path d="M41 51 C36 51 32 48 32 43" stroke-width="3.2" />
    <!-- Left pedigree branch -->
    <path d="M32 36 C22 36 16 30 16 21" stroke-width="3.4" />
    <!-- Center pedigree stem -->
    <path d="M32 34 V15" stroke-width="3.4" />
    <!-- Right pedigree branch -->
    <path d="M32 36 C42 36 48 30 48 21" stroke-width="3.4" />
  </g>

  <!-- Generational family nodes -->
  <!-- Center crown node -->
  <circle cx="32" cy="14" r="6.2" fill="#fde68a" stroke="#ffffff" stroke-width="2" />
  <!-- Left branch node -->
  <circle cx="16" cy="21" r="5.2" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5" />
  <!-- Right branch node -->
  <circle cx="48" cy="21" r="5.2" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5" />
  <!-- Root heart node at fork -->
  <circle cx="32" cy="35" r="3.6" fill="#ffffff" />
</svg>
