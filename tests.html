<link rel="icon" type="image/svg+xml" href="favicon.svg">

<body>
<h1>Family Tree — Corner Case Tests <small>v1</small></h1>
<p style="color:#94a3b8">Tests the static helpers in FamilyTreeBuilder, plus end-to-end build() scenarios.</p>
<div id="summary-placeholder"></div>
<div id="output"></div>

<script type="module">

function goToNextError(currentIndex) {
    const nextIndex = currentIndex + 1;
    const errEl = document.getElementById('error-' + nextIndex);
    if (errEl) {
        errEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        errEl.style.backgroundColor = 'rgba(248, 113, 113, 0.2)';
        setTimeout(() => errEl.style.backgroundColor = 'transparent', 1000);
    } else {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}
window.goToNextError = goToNextError;

const out = document.getElementById('output');
var passed = 0, failed = 0, total = 0;

// ─── Test Helpers ────────────────────────────────────────────────────────────
function section(name) {
    out.innerHTML += `<div class="section">▸ ${name}</div>`;
}
function comment(text) {
    out.innerHTML += `<div class="comment">// ${text}</div>`;
}
/**
 * Records a test failure, rendering it in the UI with a navigation button.
 */
function recordFailure(desc, errorDetail = '') {
    failed++;
    const errMsg = errorDetail ? ` — ${errorDetail}` : '';
    out.innerHTML += `<div id="error-${failed}" class="fail test-error">
        ✗ FAIL: ${desc}${errMsg}
        <button onclick="goToNextError(${failed})" style="margin-left: 10px; cursor: pointer;">Next Error ⬇</button>
    </div>`;
}

/**
 * Asserts a boolean condition is truthy.
 * 
 * Examples:
 *   assert('Node exists', !!node);
 */
function assert(desc, condition) {
    total++;
    if (condition) {
        passed++;
        out.innerHTML += `<div class="pass">  ✓ ${desc}</div>`;
    } else {
        recordFailure(desc);
    }
}

/**
 * Asserts strict equality between arbitrary primitives or JSON equivalents.
 * 
 * Examples:
 *   assertEqual('Count is 1', node.partners.length, 1);
 */
function assertEqual(desc, actual, expected) {
    total++;
    if (actual === expected) {
        passed++;
        out.innerHTML += `<div class="pass">  ✓ ${desc}</div>`;
    } else {
        recordFailure(desc, `expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
    }
}

// ─── Load FamilyTreeBuilder + Person + FamilyTree from App.jsx ───────────────
try {
    const response = await fetch('App.jsx?t=' + Date.now());
    const source = await response.text();

/**
     * Extracts a balanced braced code block (e.g., class or function) from JS source.
     * Robustly skips over string literals, template literals, and comments to prevent
     * false brace matches, ensuring accurate extraction of App.jsx dependencies.
     *
     * Examples:
     *   extractBlock('class Foo { a = "{"; }', 'class Foo') => 'class Foo { a = "{"; }'
     */
    // Extract a braced code block (class or function) from source
    function extractBlock(src, marker) {
        const start = src.indexOf(marker);
        if (start === -1) throw new Error(`Could not find ${marker}`);
        let depth = 0, end = -1;
        for (let i = start; i < src.length; i++) {
            if (src[i] === '{') depth++;
            else if (src[i] === '}') { depth--; if (depth === 0) { end = i + 1; break; } }
        }
        if (end === -1) throw new Error(`Could not find end of ${marker}`);
        return src.substring(start, end);
    }
    const extractClass = (src, className) => extractBlock(src, `class ${className} {`);
    function extractFunction(src, funcName) {
        const marker = `function ${funcName}(`;
        const start = src.indexOf(marker);
        if (start === -1) throw new Error(`Could not find ${marker}`);
        let paramDepth = 0;
        let paramEnd = -1;
        for (let i = start + marker.length - 1; i < src.length; i++) {
            if (src[i] === '(') paramDepth++;
            else if (src[i] === ')') {
                paramDepth--;
                if (paramDepth === 0) { paramEnd = i; break; }
            }
        }
        if (paramEnd === -1) throw new Error(`Could not find parameter closing paren for ${marker}`);
        const bodyStart = src.indexOf('{', paramEnd);
        let depth = 0, end = -1;
        for (let i = bodyStart; i < src.length; i++) {
            if (src[i] === '{') depth++;
            else if (src[i] === '}') { depth--; if (depth === 0) { end = i + 1; break; } }
        }
        if (end === -1) throw new Error(`Could not find end of ${marker}`);
        return src.substring(start, end);
    }

    const csvParserSrc = extractClass(source, 'CSVParser');
    const personSrc = extractClass(source, 'Person');
    const familyTreeSrc = extractClass(source, 'FamilyTree');
    const printTileBoundsSrc = extractClass(source, 'PrintTileBounds');
    const printGridSpecSrc = extractClass(source, 'PrintGridSpec');
    const ghostWorkspaceSrc = extractClass(source, 'GhostWorkspace');
    const builderSrc = extractClass(source, 'FamilyTreeBuilder');
    const svgTreeRendererSrc = extractClass(source, 'SvgTreeRenderer');
    const svgViewerDocumentSrc = extractClass(source, 'SvgViewerDocument');
    const a4PrintComposerSrc = extractClass(source, 'A4PrintComposer');
    const intervalContourSrc = extractClass(source, 'IntervalContour');
    const bridgePathSrc = extractFunction(source, '_generateSpouseBridgePath');
    const stemPathSrc = extractFunction(source, '_generateSingleChildStemPath');
    const busBarPathSrc = extractFunction(source, '_generateBusBarPath');
    const layoutSubtreeSrc = extractFunction(source, 'layoutSubtree');
    const flattenTreeLayoutSrc = extractFunction(source, 'flattenTreeLayout');
    const shouldRerootSrc = extractFunction(source, 'shouldRerootForPerson');

    const findBestAnchorNodeSrc = extractFunction(source, 'findBestAnchorNode');
    const getContainerScreenCenterSrc = extractFunction(source, 'getContainerScreenCenter');
    const calculateShiftedCameraSrc = extractFunction(source, 'calculateShiftedCamera');
    const projectNodeToScreenSrc = extractFunction(source, 'projectNodeToScreen');
    const resolveUpdatedCameraShiftSrc = extractFunction(source, 'resolveUpdatedCameraShift');
    const computeUpdatedTreeLayoutSrc = extractFunction(source, 'computeUpdatedTreeLayout');
    const computeLayoutAnchorShiftSrc = extractFunction(source, 'computeLayoutAnchorShift');
    const applyCameraShiftTransitionSrc = extractFunction(source, 'applyCameraShiftTransition');
    const executeBackgroundTreeTransitionSrc = extractFunction(source, 'executeBackgroundTreeTransition');

    const geoSrc = extractBlock(source, 'const LOCATION_GEO_HIERARCHY =');
    const sortedGeoSrc = 'const SORTED_GEO_ENTRIES = Object.entries(LOCATION_GEO_HIERARCHY).sort((a, b) => b[0].length - a[0].length);';
    const resolvePlaceSrc = extractBlock(source, 'const resolvePlaceHierarchy =');
    const matchesPlaceFilterSrc = extractFunction(source, 'matchesPlaceFilter');
    const matchesPersonSearchSrc = extractFunction(source, 'matchesPersonSearch');
    const matchesPersonFilterSrc = extractFunction(source, 'matchesPersonFilter');
    const filterBadgeConfigSrc = "const FILTER_BADGE_CONFIG = Object.freeze(" + extractBlock(source, "{\n    family: {") + ");";
    const getPersonCardThemeSrc = extractFunction(source, 'getPersonCardTheme');

    const [
        CSVParser, Person, FamilyTree, FamilyTreeBuilder,
        SvgTreeRenderer, SvgViewerDocument, A4PrintComposer,
        layoutSubtree, flattenTreeLayout, resolvePlaceHierarchy,
        shouldRerootForPerson, matchesPersonFilter, FILTER_BADGE_CONFIG,
        getPersonCardTheme, executeBackgroundTreeTransition,
        computeLayoutAnchorShift, computeUpdatedTreeLayout,
        findBestAnchorNode, calculateShiftedCamera
    ] = new Function(`
        ${csvParserSrc}
        ${personSrc}
        ${familyTreeSrc}
        ${printTileBoundsSrc}
        ${printGridSpecSrc}
        ${ghostWorkspaceSrc}
        ${builderSrc}
        ${svgTreeRendererSrc}
        ${svgViewerDocumentSrc}
        ${a4PrintComposerSrc}
        ${intervalContourSrc}
        const TREE_NODE_WIDTH = 90;
        const TREE_NODE_HEIGHT = 76;
        const TREE_PARTNER_GAP = 10;
        const TREE_PARTNER_TOTAL = TREE_NODE_WIDTH + TREE_PARTNER_GAP;
        const TREE_SIBLING_GAP = 24;
        ${bridgePathSrc}
        ${stemPathSrc}
        ${busBarPathSrc}
        ${layoutSubtreeSrc}
        ${flattenTreeLayoutSrc}
        ${shouldRerootSrc}
        ${findBestAnchorNodeSrc}
        ${getContainerScreenCenterSrc}
        ${calculateShiftedCameraSrc}
        ${projectNodeToScreenSrc}
        ${resolveUpdatedCameraShiftSrc}
        ${computeUpdatedTreeLayoutSrc}
        ${computeLayoutAnchorShiftSrc}
        ${applyCameraShiftTransitionSrc}
        ${executeBackgroundTreeTransitionSrc}
        ${geoSrc}
        ${sortedGeoSrc}
        ${resolvePlaceSrc}
        ${matchesPlaceFilterSrc}
        ${matchesPersonSearchSrc}
        ${matchesPersonFilterSrc}
        ${filterBadgeConfigSrc}
        ${getPersonCardThemeSrc}
        FamilyTreeBuilder.matchesPersonFilter = matchesPersonFilter;
        FamilyTreeBuilder.FILTER_BADGE_CONFIG = FILTER_BADGE_CONFIG;
        FamilyTreeBuilder.computeFilterHighlightedIds = function(tree, activeFilter) {
            if (!tree || !activeFilter || activeFilter.filterType === 'directory') return null;
            const normVal = (activeFilter.value || '').toLowerCase().trim();
            if (!normVal && activeFilter.filterType !== 'search') return null;
            const ids = new Set();
            (tree.all || []).forEach(p => {
                if (matchesPersonFilter(p, activeFilter.filterType, normVal)) {
                    ids.add(p.id);
                }
            });
            return ids;
        };
        return [
            CSVParser, Person, FamilyTree, FamilyTreeBuilder,
            SvgTreeRenderer, SvgViewerDocument, A4PrintComposer,
            layoutSubtree, flattenTreeLayout, resolvePlaceHierarchy,
            shouldRerootForPerson, matchesPersonFilter, FILTER_BADGE_CONFIG,
            getPersonCardTheme, executeBackgroundTreeTransition,
            computeLayoutAnchorShift, computeUpdatedTreeLayout,
            findBestAnchorNode, calculateShiftedCamera
        ];
    `)();

    const getYob = (n) => n.yob || n._inferredYob;

    // Generational priors, read live from the builder. A test that exercises a deduction must
    // express its expectation THROUGH these constants rather than restating the number they
    // happen to produce today (e.g. `1940 + GAPS.MATERNAL_FIRST_CHILD`, never `1964`).
    // Otherwise retuning a prior breaks assertions that were never about the prior's value.
    const GAPS = FamilyTreeBuilder.GENERATIONAL_GAPS;

    /**
     * Builds a FamilyTree from raw row data in one call.
     *
     * Examples:
     *   buildTree([{ _sourceId: 's1', Name: 'John', ... }], { s1: 'Sheet1' })
     *   => FamilyTree { nodes, rootId, sheetNames }
     *
     *   buildTree([{ _sourceId: 's1', Name: 'Ravi', Spouse: 'Lakshmi' }])
     *   => FamilyTree (empty sheetNames defaults to {})
     */
    function buildTree(rows, sheetNames = {}) {
        return new FamilyTreeBuilder(rows, sheetNames).build();
    }

    /**
     * Finds a concrete (non-ghost) person node by exact name.
     * Returns null if not found.
     *
     * Examples:
     *   findPerson(tree, 'Ravi')    => Person { name: 'Ravi', isGhost: undefined }
     *   findPerson(tree, 'Nobody')  => null
     */
    function findPerson(tree, name) {
        return tree.all.find(n => n.name === name && !n.isGhost) || null;
    }

    /**
     * Finds all concrete (non-ghost) person nodes matching exact name.
     *
     * Examples:
     *   findAllPersons(tree, 'Anthony')  => [Person, Person]  // two Anthonys
     *   findAllPersons(tree, 'Nobody')   => []
     */
    function findAllPersons(tree, name) {
        return tree.all.filter(n => n.name === name && !n.isGhost);
    }

    /**
     * BFS from the tree root, returning all reachable node IDs.
     * Traverses partners, children, and parent links bidirectionally.
     *
     * Examples:
     *   getReachableIds(tree)  => Set { 'root_id', 'child_id', 'spouse_id', ... }
     */
    function getReachableIds(tree) {
        const visited = new Set();
        const queue = [tree.rootId];
        while (queue.length > 0) {
            const id = queue.shift();
            if (!id || visited.has(id)) continue;
            visited.add(id);
            const p = tree.get(id);
            if (!p) continue;
            if (p.partners) p.partners.forEach(pid => queue.push(pid));
            if (p.children) p.children.forEach(cid => queue.push(cid));
            if (p.fatherId) queue.push(p.fatherId);
            if (p.momId) queue.push(p.momId);
        }
        return visited;
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  1. _deduceYearsFromAge — computing YOB & death year from various inputs
    // ══════════════════════════════════════════════════════════════════════════
        section('1. _deduceYearsFromAge — YOB and death year computation');

    comment('Living person with known age → YOB = currentYear - age');
    let r = FamilyTreeBuilder._deduceYearsFromAge('50', '', '', '', 2026);
    assertEqual('age=50, year=2026 → yob=1976', r.yob, 1976);
    assertEqual('living person → death is empty', r.death, '');

    comment('Deceased person: age=75, died 10 years ago → yob = (2026-10) - 75 = 1941');
    r = FamilyTreeBuilder._deduceYearsFromAge('75', '10', '', '', 2026);
    assertEqual('age=75, died 10yr ago → yob=1941', r.yob, 1941);
    assertEqual('died 10yr ago → death=2016', r.death, 2016);

    comment('Explicit YOB overrides age-based deduction');
    r = FamilyTreeBuilder._deduceYearsFromAge('50', '', '1960', '', 2026);
    assertEqual('explicit yob=1960 wins over age=50', r.yob, 1960);

    comment('Explicit death year as string');
    r = FamilyTreeBuilder._deduceYearsFromAge('', '', '1950', '2020', 2026);
    assertEqual('explicit death=2020', r.death, 2020);
    assertEqual('explicit yob=1950', r.yob, 1950);

    comment('Non-numeric death text preserved as-is');
    r = FamilyTreeBuilder._deduceYearsFromAge('', '', '1950', 'circa 2000', 2026);
    assertEqual('text death preserved', r.death, 'circa 2000');

    comment('Age of 0 or negative is rejected');
    r = FamilyTreeBuilder._deduceYearsFromAge('0', '', '', '', 2026);
    assertEqual('age=0 → yob=0 (rejected)', r.yob, 0);
    r = FamilyTreeBuilder._deduceYearsFromAge('-5', '', '', '', 2026);
    assertEqual('age=-5 → yob=0 (rejected)', r.yob, 0);

    comment('Age over 110 is rejected (unrealistic)');
    r = FamilyTreeBuilder._deduceYearsFromAge('120', '', '', '', 2026);
    assertEqual('age=120 → yob=0 (rejected)', r.yob, 0);

    comment('Both age and death year: age of death is computed');
    r = FamilyTreeBuilder._deduceYearsFromAge('80', '', '', '2020', 2026);
    assertEqual('age=80, death=2020 → yob=1940', r.yob, 1940);

    comment('Empty strings → no data');
    r = FamilyTreeBuilder._deduceYearsFromAge('', '', '', '', 2026);
    assertEqual('all empty → yob=0', r.yob, 0);
    assertEqual('all empty → death=""', r.death, '');


    // ══════════════════════════════════════════════════════════════════════════
    //  2. _extractColumnValue — fuzzy column name matching with collision guards
    // ══════════════════════════════════════════════════════════════════════════
        section('2. _extractColumnValue — column name matching');

    const row1 = {
        'Name': 'John',
        'Year of Birth': '1980',
        'Father': 'Thomas',
        "Father's Location": 'New York',
        'Spouse Prefer Husband': 'Mary',
        'Mother': 'Anna',
    };
    const keys1 = Object.keys(row1);

    comment('Exact match on "name"');
    assertEqual('finds Name column', FamilyTreeBuilder._extractColumnValue(keys1, row1, ['name']), 'John');

    comment('"father" matches "Father" but NOT "Father\'s Location"');
    assertEqual('father → Thomas', FamilyTreeBuilder._extractColumnValue(keys1, row1, ['father', 'dad']), 'Thomas');

    comment('"mother" matches "Mother"');
    assertEqual('mother → Anna', FamilyTreeBuilder._extractColumnValue(keys1, row1, ['mother', 'mom']), 'Anna');

    comment('"spouse" matches "Spouse Prefer Husband" via startsWith');
    assertEqual('spouse → Mary', FamilyTreeBuilder._extractColumnValue(keys1, row1, ['spouse', 'husband', 'wife']), 'Mary');

    comment('Missing column returns empty string');
    assertEqual('nickname → ""', FamilyTreeBuilder._extractColumnValue(keys1, row1, ['nickname']), '');

    comment('Column with location in name is skipped for parent lookups');
    const row2 = { "Father's Location": 'Delhi', "Father Family Name": 'Sharma' };
    const keys2 = Object.keys(row2);
    assertEqual('father location skipped', FamilyTreeBuilder._extractColumnValue(keys2, row2, ['father']), '');

    comment('Spouse location column is skipped for spouse lookups');
    const row3 = { "Spouse Location": 'Mumbai' };
    const keys3 = Object.keys(row3);
    assertEqual('spouse location skipped', FamilyTreeBuilder._extractColumnValue(keys3, row3, ['spouse']), '');


    // ══════════════════════════════════════════════════════════════════════════
    //  3. _propagateSpouseYobs — husband/wife age gap deduction
    // ══════════════════════════════════════════════════════════════════════════
        section('3. _propagateSpouseYobs — spouse YOB propagation');

    comment('Rule: the husband is assumed SPOUSAL_GENDER_OFFSET years OLDER than his wife');
    comment('So wife.yob = husband.yob + SPOUSAL_GENDER_OFFSET (she is born that many years later)');

    comment('Case 1: Husband known (M, b.1950), wife unknown (F) → wife is one offset younger');
    let h = { gender: 'M', yob: 1950, _inferredYob: null, spouseType: '' };
    let w = { gender: 'F', yob: null, _inferredYob: null, spouseType: '' };
    assert('propagates husband→wife', FamilyTreeBuilder._propagateSpouseYobs(h, w, getYob));
    assertEqual('wife._inferredYob = husband + SPOUSAL_GENDER_OFFSET',
        w._inferredYob, 1950 + GAPS.SPOUSAL_GENDER_OFFSET);

    comment('Case 2: Wife known (F, b.1960), husband unknown (M) → husband is one offset older');
    w = { gender: 'F', yob: 1960, _inferredYob: null, spouseType: '' };
    h = { gender: 'M', yob: null, _inferredYob: null, spouseType: '' };
    assert('propagates wife→husband', FamilyTreeBuilder._propagateSpouseYobs(w, h, getYob));
    assertEqual('husband._inferredYob = wife - SPOUSAL_GENDER_OFFSET',
        h._inferredYob, 1960 - GAPS.SPOUSAL_GENDER_OFFSET);

    comment('Case 3: Both have known YOB → no propagation needed');
    let p1 = { gender: 'M', yob: 1950, _inferredYob: null, spouseType: '' };
    let p2 = { gender: 'F', yob: 1953, _inferredYob: null, spouseType: '' };
    assert('both known → returns false', !FamilyTreeBuilder._propagateSpouseYobs(p1, p2, getYob));

    comment('Case 4: Neither has YOB → cannot propagate');
    p1 = { gender: 'M', yob: null, _inferredYob: null, spouseType: '' };
    p2 = { gender: 'F', yob: null, _inferredYob: null, spouseType: '' };
    assert('both unknown → returns false', !FamilyTreeBuilder._propagateSpouseYobs(p1, p2, getYob));

    comment('Case 5: Unknown genders → same age fallback (0-year gap)');
    let known = { gender: null, yob: 1970, _inferredYob: null, spouseType: '' };
    let unknown = { gender: null, yob: null, _inferredYob: null, spouseType: '' };
    assert('unknown gender propagates', FamilyTreeBuilder._propagateSpouseYobs(known, unknown, getYob));
    assertEqual('same age fallback → 1970', unknown._inferredYob, 1970);

    comment('Case 6: spouseType="wife" means the column is "wife", so n HAS a wife → n is husband');
    comment('sp1 is husband (spouseType=wife → spouse IS wife), so sp2 = 1960 + SPOUSAL_GENDER_OFFSET');
    let sp1 = { gender: null, yob: 1960, _inferredYob: null, spouseType: 'wife' };
    let sp2 = { gender: null, yob: null, _inferredYob: null, spouseType: '' };
    FamilyTreeBuilder._propagateSpouseYobs(sp1, sp2, getYob);
    assertEqual('sp1 (husband via spouseType) → sp2 (wife) = sp1 + SPOUSAL_GENDER_OFFSET',
        sp2._inferredYob, 1960 + GAPS.SPOUSAL_GENDER_OFFSET);

    comment('Case 7: Already-inferred YOB is NOT overwritten');
    w = { gender: 'F', yob: null, _inferredYob: 1955, spouseType: '' };
    h = { gender: 'M', yob: 1950, _inferredYob: null, spouseType: '' };
    assert('no overwrite', !FamilyTreeBuilder._propagateSpouseYobs(h, w, getYob));
    assertEqual('wife stays at 1955', w._inferredYob, 1955);


    // ══════════════════════════════════════════════════════════════════════════
    //  4. _propagateParentChildYobs — parent-child age gap deduction
    // ══════════════════════════════════════════════════════════════════════════
        section('4. _propagateParentChildYobs — parent-child YOB propagation');

    comment('Rule: the mother is assumed MATERNAL_FIRST_CHILD years older than her first child');
    let mom = { gender: 'F', yob: 1940, _inferredYob: null, id: 'm1' };
    let child = { yob: null, _inferredYob: null, momId: 'm1', fatherId: null };
    assert('mother→child propagates', FamilyTreeBuilder._propagateParentChildYobs(mom, child, getYob));
    assertEqual('child._inferredYob = mother + MATERNAL_FIRST_CHILD',
        child._inferredYob, 1940 + GAPS.MATERNAL_FIRST_CHILD);

    comment('Rule: the father is assumed PATERNAL_FIRST_CHILD years older than his first child');
    comment('(PATERNAL_FIRST_CHILD is derived: MATERNAL_FIRST_CHILD + SPOUSAL_GENDER_OFFSET)');
    let dad = { gender: 'M', yob: 1938, _inferredYob: null, id: 'd1' };
    child = { yob: null, _inferredYob: null, momId: null, fatherId: 'd1' };
    assert('father→child propagates', FamilyTreeBuilder._propagateParentChildYobs(dad, child, getYob));
    assertEqual('child._inferredYob = father + PATERNAL_FIRST_CHILD',
        child._inferredYob, 1938 + GAPS.PATERNAL_FIRST_CHILD);

    comment('Reverse: known child → deduce mother YOB');
    mom = { gender: 'F', yob: null, _inferredYob: null, id: 'm2' };
    child = { yob: 1980, _inferredYob: null, momId: 'm2', fatherId: null };
    assert('child→mother propagates', FamilyTreeBuilder._propagateParentChildYobs(mom, child, getYob));
    assertEqual('mother._inferredYob = child - MATERNAL_FIRST_CHILD',
        mom._inferredYob, 1980 - GAPS.MATERNAL_FIRST_CHILD);

    comment('Reverse: known child → deduce father YOB');
    dad = { gender: 'M', yob: null, _inferredYob: null, id: 'd2' };
    child = { yob: 1980, _inferredYob: null, momId: null, fatherId: 'd2' };
    assert('child→father propagates', FamilyTreeBuilder._propagateParentChildYobs(dad, child, getYob));
    assertEqual('father._inferredYob = child - PATERNAL_FIRST_CHILD',
        dad._inferredYob, 1980 - GAPS.PATERNAL_FIRST_CHILD);

    comment('Both known → no propagation');
    mom = { gender: 'F', yob: 1940, _inferredYob: null, id: 'm3' };
    child = { yob: 1965, _inferredYob: null, momId: 'm3', fatherId: null };
    assert('both known → false', !FamilyTreeBuilder._propagateParentChildYobs(mom, child, getYob));


    // ══════════════════════════════════════════════════════════════════════════
    //  5. _propagateSiblingYobs — sibling chain age gap deduction
    // ══════════════════════════════════════════════════════════════════════════
        section('5. _propagateSiblingYobs — sibling chain propagation');

    comment('Rule: Consecutive siblings are assumed 2 years apart');

    comment('Forward: oldest known → fill younger siblings');
    let sibs = [
        { yob: 1980, _inferredYob: null },
        { yob: null, _inferredYob: null },
        { yob: null, _inferredYob: null },
    ];
    assert('forward propagation', FamilyTreeBuilder._propagateSiblingYobs(sibs, getYob));

    // ══════════════════════════════════════════════════════════════════════════
        section('6. _isValidParentCandidate — parent age-gap validation');

    const makeNode = (overrides) => ({
        id: 'n' + Math.random().toString(36).slice(2, 6),
        yob: null, _inferredYob: null, gender: null, isGhost: false,
        _sourceId: 's1', _sourceIds: new Set(['s1']),
        ...overrides,
    });

    comment('Valid: mother 25yr older than child (comfortably inside the parental age range)');
    assert('25yr gap valid for mother',
        FamilyTreeBuilder._isValidParentCandidate(
            makeNode({ yob: 1950 }), makeNode({ yob: 1975 }), 'mother', 'mom', {}));

    comment('Invalid: mother only 5yr older (far below any plausible parental age floor)');
    assert('5yr gap invalid',
        !FamilyTreeBuilder._isValidParentCandidate(
            makeNode({ yob: 1970 }), makeNode({ yob: 1975 }), 'mother', 'mom', {}));

    // Probe the floor *relative to the constant*. MIN_PARENTAL_AGE is a retunable
    // prior, not a law of nature, so a test that hard-codes "13 is invalid, 14 is
    // valid" only restates today's value and blocks any future recalibration.
    // At MIN_PARENTAL_AGE = 14 these are the 1962 and 1961 mothers of a 1975 child.
    comment('Invalid: mother one year short of the MIN_PARENTAL_AGE floor');
    assert('mother one year under the parental age floor is invalid',
        !FamilyTreeBuilder._isValidParentCandidate(
            makeNode({ yob: 1975 - GAPS.MIN_PARENTAL_AGE + 1 }), makeNode({ yob: 1975 }), 'mother', 'mom', {}));

    comment('Valid: mother exactly at the MIN_PARENTAL_AGE floor');
    assert('mother exactly at the parental age floor is valid',
        FamilyTreeBuilder._isValidParentCandidate(
            makeNode({ yob: 1975 - GAPS.MIN_PARENTAL_AGE }), makeNode({ yob: 1975 }), 'mother', 'mom', {}));

    comment('Invalid: mother 60yr older (above 55yr max for mothers)');
    assert('60yr gap invalid for mother',
        !FamilyTreeBuilder._isValidParentCandidate(
            makeNode({ yob: 1910 }), makeNode({ yob: 1970 }), 'mother', 'mom', {}));

    comment('Valid: father 60yr older (within 14–80 range for fathers)');
    assert('60yr gap valid for father',
        FamilyTreeBuilder._isValidParentCandidate(
            makeNode({ yob: 1910 }), makeNode({ yob: 1970 }), 'father', 'dad', {}));

    comment('Invalid: father 85yr older (above 80yr max for fathers)');
    assert('85yr gap invalid for father',
        !FamilyTreeBuilder._isValidParentCandidate(
            makeNode({ yob: 1885 }), makeNode({ yob: 1970 }), 'father', 'dad', {}));

    comment('Unknown YOB → defaults to valid (cannot check)');
    assert('no YOB → valid',
        FamilyTreeBuilder._isValidParentCandidate(
            makeNode({ yob: null }), makeNode({ yob: 1975 }), 'mother', 'mom', {}));

    comment('Candidate is younger than child → invalid (negative age diff)');
    assert('candidate younger → invalid',
        !FamilyTreeBuilder._isValidParentCandidate(
            makeNode({ yob: 1980 }), makeNode({ yob: 1975 }), 'mother', 'mom', {}));

        section('20. _isValidParentCandidate — grey zone (50-55yr mother gap)');

    comment('51yr gap: valid ONLY if candidate has another child within 14-50yr');
    const nodeMap20 = {};

    comment('No valid earlier child → rejected in grey zone');
    assert('51yr gap, no earlier child → invalid',
        !FamilyTreeBuilder._isValidParentCandidate(motherGZ, childGZ, 'mother', 'gz_mom', nodeMap20));

    // Sits one year under the floor by construction, so retuning MIN_PARENTAL_AGE
    // cannot quietly turn this child into a qualifying one. At 14 it is the 1933
    // child of a 1920 mother.
    comment('Earlier child born just under the MIN_PARENTAL_AGE floor is rejected as a valid earlier child');
    const childUnder14 = makeNode({ yob: 1920 + GAPS.MIN_PARENTAL_AGE - 1, momId: 'gz_mom' });

    assert('earlier child under the parental age floor does not qualify mother for grey zone',
        !FamilyTreeBuilder._isValidParentCandidate(motherGZ, childGZ, 'mother', 'gz_mom', nodeMapUnder14));

    comment('Add a valid earlier child (35yr gap) → NOW accepted');
    const earlierChild = makeNode({ yob: 1955, momId: 'gz_mom' });
    earlierChild._sourceId = 's1';
    earlierChild._sourceIds = new Set(['s1']);

    // ══════════════════════════════════════════════════════════════════════════
    //  22. _isValidSpouseCandidate — relationType-specific age constraints
    // ══════════════════════════════════════════════════════════════════════════
        section('22. _isValidSpouseCandidate — relationType-specific age rules');

    comment('relationType="husband": candidate IS husband, so ageDiff (cand-source) should be ≤ 0');
    comment('i.e., husband born BEFORE wife. ageDiff = candidate.yob - source.yob');
    comment('The window edges come from MAX_FIRST_WIFE_AGE_DIFF, not from literals, so these');
    comment('assertions keep testing the ordering rule after the prior is retuned.');
    {
        const T = FamilyTreeBuilder.HEURISTIC_PRIORS.MAX_FIRST_WIFE_AGE_DIFF;
        const mid = Math.round(T / 2);  // comfortably inside the window, well off either edge
        const bornIn = (yob, tag) => ({ gender: null, yob, _inferredYob: null, isGhost: false,
            _sourceId: 's1', _sourceIds: new Set(['s1']),
            partners: [], spouse: '', _localImplicitSpouses: [], _normName: tag });
        const wife1970 = { gender: null, yob: 1970, _inferredYob: null, _sourceId: 's1', _sourceIds: new Set(['s1']), _normName: 'w1' };
        const husband1970 = { gender: null, yob: 1970, _inferredYob: null, _sourceId: 's1', _sourceIds: new Set(['s1']), _normName: 'h3' };

        assert(`husband older by ${mid}yr → valid (ageDiff=-${mid}, inside [-${T},0])`,
            FamilyTreeBuilder._isValidSpouseCandidate(bornIn(1970 - mid, 'h_mid'), wife1970, 'husband'));

        assert(`husband older by ${T}yr → valid (at the MAX_FIRST_WIFE_AGE_DIFF boundary)`,
            FamilyTreeBuilder._isValidSpouseCandidate(bornIn(1970 - T, 'h_at'), wife1970, 'husband'));

        assert(`husband older by ${T + 1}yr → invalid (one past the MAX_FIRST_WIFE_AGE_DIFF boundary)`,
            !FamilyTreeBuilder._isValidSpouseCandidate(bornIn(1970 - T - 1, 'h_over'), wife1970, 'husband'));

        comment('relationType="husband" but candidate younger → invalid (ageDiff > 0)');
        assert('husband younger → invalid',
            !FamilyTreeBuilder._isValidSpouseCandidate(bornIn(1975, 'h2'), wife1970, 'husband'));

        comment('relationType="wife": candidate IS wife, so ageDiff should be ≥ 0 (wife born after)');
        assert(`wife younger by ${mid}yr → valid (ageDiff=${mid}, inside [0,${T}])`,
            FamilyTreeBuilder._isValidSpouseCandidate(bornIn(1970 + mid, 'w_mid'), husband1970, 'wife'));

        assert(`wife younger by ${T}yr → valid (at the MAX_FIRST_WIFE_AGE_DIFF boundary)`,
            FamilyTreeBuilder._isValidSpouseCandidate(bornIn(1970 + T, 'w_at'), husband1970, 'wife'));

        assert(`wife younger by ${T + 1}yr → invalid (one past the MAX_FIRST_WIFE_AGE_DIFF boundary)`,
            !FamilyTreeBuilder._isValidSpouseCandidate(bornIn(1970 + T + 1, 'w_over'), husband1970, 'wife'));
    }

    // ══════════════════════════════════════════════════════════════════════════
    // Layout Visual Connection Test API
    // ══════════════════════════════════════════════════════════════════════════
    //
    // Extracts the actual layoutSubtree + flattenTreeLayout functions from
    // App.jsx and runs them to determine which parent card each child's
    // drop-stem visually connects to.
    //
    // Returns a Map:  childName → { parentCardName, isMultiSpouseSplit, connectionOffset }
    function getVisualParentMap(tree, rootPersonName) {
        const rootPerson = findPerson(tree, rootPersonName);
        if (!rootPerson) return new Map();

        const constBlock = [
            'TREE_NODE_WIDTH', 'TREE_NODE_HEIGHT', 'TREE_PARTNER_GAP',
            'TREE_PARTNER_TOTAL', 'TREE_SIBLING_GAP'
        ].map(name => {
            const re = new RegExp('const ' + name + '\\s*=\\s*[^;]+;');
            const m = source.match(re);
            if (!m) throw new Error('Could not find constant ' + name);
            return m[0];
        }).join('\n');

        const contourSrc = extractClass(source, 'IntervalContour');
        const layoutSubtreeSrc = extractFunction(source, 'layoutSubtree');
        const bridgeSrc = extractFunction(source, '_generateSpouseBridgePath');
        const stemSrc = extractFunction(source, '_generateSingleChildStemPath');
        const busBarSrc = extractFunction(source, '_generateBusBarPath');
        const flattenSrc = extractFunction(source, 'flattenTreeLayout');

        const layoutEnv = new Function('Person', 'FamilyTree', `
            ${constBlock}
            ${contourSrc}
            ${layoutSubtreeSrc}
            ${bridgeSrc}
            ${stemSrc}
            ${busBarSrc}
            ${flattenSrc}
            return { layoutSubtree, flattenTreeLayout, TREE_NODE_WIDTH };
        `)(Person, FamilyTree);

        const { layoutSubtree, flattenTreeLayout, TREE_NODE_WIDTH } = layoutEnv;

        const stats = tree.getStats();
        const ppy = 3;
        const layoutConfig = {
            collapsedNodes: new Set(),
            visibleNodes: new Set(tree.all.map(n => n.id)),
            rootNodeYob: stats.rootNodeYob || 1900,
            ppy
        };

        const subtree = layoutSubtree(rootPerson, tree, layoutConfig, new Set());
        if (!subtree) return new Map();

        const result = new Map();

        function walkLayout(sub, originX) {
            const { memberLayouts, isMultiSpouseSplit } = sub;
            memberLayouts.forEach(mInfo => {
                if (mInfo.childLayouts.length > 0) {
                    mInfo.childLayouts.forEach(cSub => {
                        const bloodline = cSub.memberLayouts.find(m => m.isBloodline);
                        const connectionOffset = bloodline
                            ? bloodline.cardX + TREE_NODE_WIDTH / 2
                            : 0;

                        result.set(cSub.person.name, {
                            parentCardName: mInfo.person.name,
                            isMultiSpouseSplit: !!isMultiSpouseSplit,
                            connectionOffset
                        });
                        walkLayout(cSub, originX + cSub.relX);
                    });
                }
            });
        }

        walkLayout(subtree, 0);
        return result;
    }

            assert('Test 76: Kunjayi node exists in the tree', !!kunjayi);
            assertEqual('Test 76: Kunjayi birth year is 1912', kunjayi?.yob, 1912);

            // Viewport calculation simulation matching App.jsx getBounds logic
            const computeBounds = (contW, contH, treeW, treeH, z, timelineWidth = 48, paddingX = 40, paddingY = 80) => {
                const usableContW = Math.max(100, contW - timelineWidth);
                const minZ = Math.max(0.05, Math.min((usableContW - paddingX * 2) / treeW, 1));
                const scaledW = treeW * z;
                const scaledH = treeH * z;

                let minX = scaledW <= usableContW ? timelineWidth + (usableContW - scaledW) / 2 : contW - scaledW - paddingX;
                let maxX = scaledW <= usableContW ? timelineWidth + (usableContW - scaledW) / 2 : timelineWidth + paddingX;
                let minY = scaledH <= contH ? (contH - scaledH) / 2 : contH - scaledH - paddingY;
                let maxY = scaledH <= contH ? (contH - scaledH) / 2 : paddingY;

                return { minX, maxX, minY, maxY, minZ, usableContW };

    {

        const atLimit = { ...wifeBase, name: `Wife${T}yr`, yob: 1960 + T, _normName: `wife${T}yr` };
        const overLimit = { ...wifeBase, name: `Wife${T + 1}yr`, yob: 1960 + T + 1, _normName: `wife${T + 1}yr` };
        // "Wife 2" naming marks her as a subsequent spouse, which lifts the first-marriage

        assert(`Test 90A: ${T + 1}yr age difference between husband and first wife is invalid (one past the limit)`,

        assert(`Test 90A: ${T + 2}yr age difference for subsequent wife (Wife 2) is valid (<= MAX_SPOUSE_AGE_DIFF)`,

    // ══════════════════════════════════════════════════════════════════════════
    section('120. TopNavigation Minimized Search Button and Focus Expansion');

    // 120A: Helper to determine TopNavigation UI state (search bar vs floating buttons and arrows)
    {
        try {
            function getTopNavigationUIState({ isSearchActive, canGoBack, canGoForward }) {
                if (isSearchActive) {
                    return {
                        mode: 'expanded',
                        showSearchBar: true,
                        showOtherFloatingButtons: false,
                        showLeftArrow: true,
                        showRightArrow: true,
                        isLeftArrowDisabled: !canGoBack,
                        isRightArrowDisabled: !canGoForward
                    };
                } else {
                    return {
                        mode: 'minimized',
                        showSearchBar: false,
                        showOtherFloatingButtons: true,
                        showSearchFloatingButton: true,
                        showLeftArrow: false,
                        showRightArrow: false,
                        isLeftArrowDisabled: false,
                        isRightArrowDisabled: false
                    };
                }
            }

            // Minimized state: search bar is minimized to floating button, other floating buttons are shown, arrows hidden
            const minState = getTopNavigationUIState({ isSearchActive: false, canGoBack: false, canGoForward: false });
            assert('Test 120A: Minimized mode active', minState.mode === 'minimized');
            assert('Test 120A: Search bar hidden in minimized mode', !minState.showSearchBar);
            assert('Test 120A: Search floating button shown in minimized mode', minState.showSearchFloatingButton);
            assert('Test 120A: Other floating buttons shown in minimized mode', minState.showOtherFloatingButtons);
            assert('Test 120A: Left arrow not shown in minimized mode', !minState.showLeftArrow);
            assert('Test 120A: Right arrow not shown in minimized mode', !minState.showRightArrow);

            // Expanded state: other floating buttons disappear, search bar appears along with left and right arrows
            const expState = getTopNavigationUIState({ isSearchActive: true, canGoBack: false, canGoForward: false });
            assert('Test 120A: Expanded mode active', expState.mode === 'expanded');
            assert('Test 120A: Search bar shown in expanded mode', expState.showSearchBar);
            assert('Test 120A: Other floating buttons disappear in expanded mode', !expState.showOtherFloatingButtons);
            assert('Test 120A: Left arrow shown in expanded mode', expState.showLeftArrow);
            assert('Test 120A: Right arrow shown in expanded mode', expState.showRightArrow);
            assert('Test 120A: Left arrow disabled when cannot go back', expState.isLeftArrowDisabled);
            assert('Test 120A: Right arrow disabled when cannot go forward', expState.isRightArrowDisabled);

            // Expanded state with canGoBack = true, canGoForward = false

                    // Focus moved to inside element (e.g. left/right arrow): stay expanded
                    return;
                }
                isSearchActive = false;
            }

    // ══════════════════════════════════════════════════════════════════════════
    //  131. Dynamic Background Live Sync & Row Fingerprint Change Detection
    // ══════════════════════════════════════════════════════════════════════════
    section("131. Dynamic Background Live Sync & Row Fingerprint Change Detection");

    // 131A: Row fingerprint detects modifications, additions, and identical unchanged rows
    {
        try {
            const computeFingerprint = (rows) => {
                if (!rows || rows.length === 0) return '';
                return rows.map(r => 
                    `${r._sourceId || ''}:${r._sheetRow || ''}:${r.Name || ''}:${r['Year of Birth'] || ''}:${r.Age || ''}:${r['Year of Death'] || ''}:${r.Mother || ''}:${r.Father || ''}:${r.Spouse || ''}:${r.Location || ''}:${r.Job || ''}`
                ).join('|');
            };

            const baseRows = [
                { _sourceId: 's1', _sheetRow: 2, Name: 'Joseph', 'Year of Birth': '1920', Spouse: 'Mariam', Location: 'Palai' },
                { _sourceId: 's1', _sheetRow: 3, Name: 'Mariam', 'Year of Birth': '1925', Spouse: 'Joseph', Location: 'Palai' },
                { _sourceId: 's1', _sheetRow: 4, Name: 'Antony', 'Year of Birth': '1950', Father: 'Joseph', Mother: 'Mariam' }
            ];

            const fp1 = computeFingerprint(baseRows);
            const fp2 = computeFingerprint([...baseRows]);

            // Unchanged dataset produces identical fingerprint
            assertEqual('Test 131A: Identical rows produce identical fingerprint', fp1, fp2);

            // Modifying a column produces a different fingerprint
            const modifiedRows = JSON.parse(JSON.stringify(baseRows));
            modifiedRows[0].Location = 'Kottayam';
            const fpModified = computeFingerprint(modifiedRows);
            assert('Test 131A: Modified location changes fingerprint', fp1 !== fpModified);

            // Adding a row produces a different fingerprint
            const addedRows = [...baseRows, { _sourceId: 's1', _sheetRow: 5, Name: 'Rosa', 'Year of Birth': '1955', Father: 'Joseph', Mother: 'Mariam' }];
            const fpAdded = computeFingerprint(addedRows);
            assert('Test 131A: Adding a child changes fingerprint', fp1 !== fpAdded);

            // Editing Year of Birth produces a different fingerprint
            const editedAgeRows = JSON.parse(JSON.stringify(baseRows));
            editedAgeRows[2]['Year of Birth'] = '1952';
            const fpAgeEdited = computeFingerprint(editedAgeRows);
            assert('Test 131A: Editing YOB changes fingerprint', fp1 !== fpAgeEdited);
        } catch (e) {
            assertEqual('Test 131A execution failed', e.message, '');
        }
    }

    // 131B: Live Sync tree rebuild retains selected focusId if person still exists
    {
        try {
            const rowsV1 = [
                { _sourceId: 's1', Name: 'Joseph', Spouse: 'Mariam' },

    {

            const computeFP = (rows) => {
                if (!rows || rows.length === 0) return '';
                return rows.map(r => {
                    const entries = Object.entries(r).sort(([a], [b]) => a.localeCompare(b));
                    return entries.map(([k, v]) => `${k}:${String(v != null ? v : '').trim()}`).join(';');
                }).join('|');
            };

            const baseRow = { _sourceId: 's1', _sheetRow: 2, Name: 'George', 'Year of Birth': '1930' };
            const editedRow = { _sourceId: 's1', _sheetRow: 2, Name: 'George', 'Year of Birth': '1930', Nickname: 'Georgie' };

            const fpEdited = computeFP([editedRow]);

            // Test 132B: Anchor layout precalculation fallback safety
            const treeA = buildTree([

            const layoutA = computeLayout(treeA, layoutConfig);

            assert('Test 132B: computeLayout produces valid layout for treeA', !!layoutA && layoutA.nodes.length >= 1);

    // ══════════════════════════════════════════════════════════════════════════
    //  135. Dual-Axis Full Viewport Fit, Branch Distribution & Fit to Screen
    // ══════════════════════════════════════════════════════════════════════════
    section('135. Dual-Axis Full Viewport Fit, Branch Distribution & Fit to Screen');

    // 135A: Dual-Axis Full Fit eliminates perimeter white space and scales height & width to viewport
    {
        try {
            const rows135 = [
                { _sourceId: 's1', _sheetRow: 1, Name: 'Thoma', Gender: 'M', 'Year of Birth': '1850' },
                { _sourceId: 's1', _sheetRow: 2, Name: 'Thoma Wife', Gender: 'F', Spouse: 'Thoma' },
                { _sourceId: 's1', _sheetRow: 3, Name: 'BranchA Son', Father: 'Thoma', Mother: 'Thoma Wife', 'Year of Birth': '1880' },
                { _sourceId: 's1', _sheetRow: 4, Name: 'BranchB Son', Father: 'Thoma', Mother: 'Thoma Wife', 'Year of Birth': '1885' },
                { _sourceId: 's1', _sheetRow: 5, Name: 'Grandson A', Father: 'BranchA Son', 'Year of Birth': '1920' },
                { _sourceId: 's1', _sheetRow: 6, Name: 'Grandson B', Father: 'BranchB Son', 'Year of Birth': '1925' }
            ];

            const builder = new FamilyTreeBuilder(rows135, { s1: 'Sheet 1' });
            const tree = builder.build();
            const stats = tree.getStats();

            assert('Test 135A: Tree has valid root', !!tree.root);
            assertEqual('Test 135A: Stats rootNodeYob is 1850', stats.rootNodeYob, 1850);
            assertEqual('Test 135A: Stats maxYear is 1925', stats.maxYear, 1925);

            const computeLayout = (t, conf) => flattenTreeLayout(layoutSubtree(t.root, t, conf, new Set()));

            // Verify layout computation with siblingGap parameter
            const layoutDefault = computeLayout(tree, {
                focusId: null,
                aiHighlightedIds: new Set(),
                rootNodeYob: stats.rootNodeYob,
                visibleNodes: new Set(Object.keys(tree.nodes)),
                collapsedNodes: new Set(),
                toggleCollapse: () => {},
                ppy: 8,
                siblingGap: 24,
                onFocus: () => {}
            });

            const layoutSpread = computeLayout(tree, {
                focusId: null,
                aiHighlightedIds: new Set(),
                rootNodeYob: stats.rootNodeYob,
                visibleNodes: new Set(Object.keys(tree.nodes)),
                collapsedNodes: new Set(),
                toggleCollapse: () => {},
                ppy: 8,
                siblingGap: 60,
                onFocus: () => {}
            });

            assert('Test 135A: Spread sibling gap produces wider layout than default', layoutSpread.width > layoutDefault.width);

            // 135B: Viewport boundary calculations with minimal card padding (CARD_PAD = 10)
            const CARD_PAD = 10;
            const contW = 1024;
            const contH = 600;
            const TIMELINE_WIDTH = 48;
            const usableContW = contW - TIMELINE_WIDTH; // 976
            const paddingX = 8;
            const topMargin = 16;
            const bottomMargin = 64;
            const usableH = contH - topMargin - bottomMargin; // 520

            const spanYears = Math.max(5, stats.maxYear - stats.rootNodeYob); // 75
            const testZ = 0.25;
            const stretchedPpy = (usableH / testZ - 76) / spanYears;

            // Verify stretchedPpy scales height to match usableH closely
            const layoutFullFit = computeLayout(tree, {
                focusId: null,
                aiHighlightedIds: new Set(),
                rootNodeYob: stats.rootNodeYob,
                visibleNodes: new Set(Object.keys(tree.nodes)),
                collapsedNodes: new Set(),
                toggleCollapse: () => {},
                ppy: stretchedPpy,
                siblingGap: 60,
                onFocus: () => {}
            });

            const camX = TIMELINE_WIDTH + paddingX;
            const camY = topMargin;
            const padXFit = CARD_PAD - layoutFullFit.minX;
            const padYFit = CARD_PAD - layoutFullFit.minY;

            const screenLefts = layoutFullFit.nodes.map(n => camX + (n.x + padXFit) * testZ);
            const screenRights = layoutFullFit.nodes.map(n => camX + (n.x + padXFit + 90) * testZ);
            const screenTops = layoutFullFit.nodes.map(n => camY + (n.y + padYFit) * testZ);
            const screenBottoms = layoutFullFit.nodes.map(n => camY + (n.y + padYFit + 76) * testZ);

            const minScreenLeft = Math.min(...screenLefts);
            const maxScreenRight = Math.max(...screenRights);
            const minScreenTop = Math.min(...screenTops);
            const maxScreenBottom = Math.max(...screenBottoms);

            assert('Test 135B: Leftmost card starts flush with timeline + padding', minScreenLeft >= TIMELINE_WIDTH && minScreenLeft <= TIMELINE_WIDTH + 20);
            assert('Test 135B: Rightmost card stays safely within container width', maxScreenRight <= contW);
            assert('Test 135B: Topmost card starts near top margin', minScreenTop >= topMargin && minScreenTop <= topMargin + 20);
            assert('Test 135B: Bottom-most card stays within container height', maxScreenBottom <= contH && maxScreenBottom >= contH * 0.85);

            // 135C: First-click Fit to Screen targets full window when sidebar was open
            const testContW = 400;
            const fullTreeW = 2000;
            const openSidebarContW = testContW - 150; // 250
            const fullWindowContW = testContW; // 400

            // If sidebar is closing (forceFullWindow = true), container width evaluates to fullWindowContW
            const resolveTargetContW = (isClosing, currentClientW, windowInnerW) => {
                return (isClosing && windowInnerW) ? windowInnerW : currentClientW;
            };

            const firstClickContW = resolveTargetContW(true, openSidebarContW, fullWindowContW);
            assertEqual('Test 135C: First click resolves to full window width even before sidebar completes transition', firstClickContW, fullWindowContW);

            const firstClickZ = Math.max(0.05, Math.min((firstClickContW - TIMELINE_WIDTH - paddingX * 2) / fullTreeW, 1));
            const firstClickRenderedW = fullTreeW * firstClickZ;
            const rightMargin = fullWindowContW - (TIMELINE_WIDTH + paddingX + firstClickRenderedW);
            assert('Test 135C: First click right margin is under 20px (no sidebar-width gap)', rightMargin <= 20);

            // 135D: Dynamic maxYear derivation (no hardcoded 2030) & exact bottom-most card screen boundary coincidence
            const boundaries = [1650, 1701, 1724, 1742, 1767, 1792, 1822, 1843, 1860, 1883, 1901, 1928, 1946, 1965, 1981, 1997, 2013, 2030, 2050];
            const filteredBoundaries = boundaries.filter(y => y >= stats.minYear - 35 && y <= stats.maxYear);

            assert('Test 135D: Boundaries are filtered dynamically by tree maxYear', Math.max(...filteredBoundaries) <= stats.maxYear);
            assert('Test 135D: Boundaries do not exceed maxYear (no 2030 or 2050 if maxYear is earlier)', !filteredBoundaries.includes(2030) && !filteredBoundaries.includes(2050));

            // Verify bottom of bottom-most card coincides with bottom visible canvas area boundary
            const contH_test = 618;
            const topMargin_test = 16;
            const bottomMargin_test = 0;
            const spanYears_test = Math.max(5, stats.maxYear - stats.rootNodeYob);
            const z_test = 0.087;
            const stretchedPpy_test = ((contH_test - bottomMargin_test - topMargin_test) / z_test - 86) / spanYears_test;
            const bottomMostCardBottom = topMargin_test + (spanYears_test * stretchedPpy_test + 86) * z_test;
            assert('Test 135D: Bottom of bottom-most card coincides with contH bottom boundary', Math.abs(bottomMostCardBottom - contH_test) < 0.0001);

            // 135E: Live sync background updates do not trigger auto-fit to screen
            let fitCallCount = 0;
            const mockFitToScreen = () => { fitCallCount++; };
            const hasInitialFitDoneMock = { current: false };

            const simulateLayoutEffect = (hasRoot) => {
                if (!hasInitialFitDoneMock.current && hasRoot) {
                    hasInitialFitDoneMock.current = true;
                    mockFitToScreen();
                }
            };

            // 1st run: initial load
            simulateLayoutEffect(true);
            assertEqual('Test 135E: Initial load triggers auto-fit once', fitCallCount, 1);

            // 2nd run: background live update
            simulateLayoutEffect(true);
            assertEqual('Test 135E: Background update does NOT re-trigger fit-to-screen', fitCallCount, 1);
        } catch (e) {
            assertEqual('Section 135 execution failed', e.message, '');
        }
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  175. Viewport Centering & Sidebar-Aware Display Port Calculations
    // ══════════════════════════════════════════════════════════════════════════
    {
        try {
            // Simulation of useCanvasControls getBounds, clampCamera, and fitToScreen logic
            const simulateCanvasBounds = ({
                windowWidth = 1200,
                windowHeight = 800,
                isSidebarOpen = false,
                sidebarWidth = 360,
                forceFullWindow = false,
                isStandalone = false,
                treeW = 300,
                treeH = 200,
                z = 1.0,
                paddingX = 8,
                topMargin = 16,
                bottomMargin = 0
            }) => {
                const effectiveContW = isSidebarOpen
                    ? (windowWidth - (sidebarWidth || 360))
                    : windowWidth;
                const contW = forceFullWindow ? windowWidth : effectiveContW;
                const contH = (forceFullWindow || !isSidebarOpen) ? windowHeight : windowHeight;

                const TIMELINE_WIDTH = isStandalone ? 0 : 48;
                const usableContW = Math.max(100, contW - TIMELINE_WIDTH);
                const usableH = Math.max(100, contH - topMargin - bottomMargin);

                const minZ = Math.max(0.05, Math.min((usableContW - paddingX * 2) / treeW, 1));
                const scaledW = treeW * z;
                const scaledH = treeH * z;

                const centeredX = TIMELINE_WIDTH + (usableContW - scaledW) / 2;

                let minX = scaledW <= usableContW ? centeredX : contW - scaledW - paddingX;
                let maxX = scaledW <= usableContW ? centeredX : TIMELINE_WIDTH + paddingX;
                let minY = scaledH <= usableH ? topMargin : contH - scaledH - bottomMargin;
                let maxY = scaledH <= usableH ? topMargin : topMargin;

                return {
                    contW, contH, usableContW, usableH,
                    minZ, scaledW, scaledH, centeredX,
                    minX, maxX, minY, maxY, TIMELINE_WIDTH
                };
            };

            const clampSimulatedCamera = (cam, bounds) => {
                const z = Math.max(bounds.minZ, Math.min(cam.z, 3));
                return {
                    x: Math.max(bounds.minX, Math.min(bounds.maxX, cam.x)),
                    y: Math.max(bounds.minY, Math.min(bounds.maxY, cam.y)),
                    z
                };
            };

            // 175.1: Small tree centering with sidebar closed
            // Window = 1200px, timeline = 48px, usable = 1152px. Tree = 300px at z = 1.0.
            const bClosed = simulateCanvasBounds({
                windowWidth: 1200,
                isSidebarOpen: false,
                treeW: 300,
                z: 1.0
            });
            assertEqual('Test 175.1: Usable container width without sidebar', bClosed.usableContW, 1152);
            assertEqual('Test 175.2: Centered X without sidebar is 474', bClosed.centeredX, 474);
            assertEqual('Test 175.3: minX equals centeredX when tree fits in viewport', bClosed.minX, 474);
            assertEqual('Test 175.4: maxX equals centeredX when tree fits in viewport', bClosed.maxX, 474);

            // Verify visual tree center equals usable viewport midpoint
            const treeCenterClosed = bClosed.centeredX + bClosed.scaledW / 2;
            const viewportCenterClosed = bClosed.TIMELINE_WIDTH + bClosed.usableContW / 2;
            assertEqual('Test 175.5: Tree visual center strictly equals viewport visual center', treeCenterClosed, viewportCenterClosed);

            // 175.2: Small tree centering with sidebar open (sidebarWidth = 360)
            // EffectiveContW = 1200 - 360 = 840px. Usable = 840 - 48 = 792px.
            const bOpen = simulateCanvasBounds({
                windowWidth: 1200,
                isSidebarOpen: true,
                sidebarWidth: 360,
                treeW: 300,
                z: 1.0
            });
            assertEqual('Test 175.6: Effective container width with sidebar open', bOpen.contW, 840);
            assertEqual('Test 175.7: Usable container width with sidebar open', bOpen.usableContW, 792);
            assertEqual('Test 175.8: Centered X with sidebar open is 294', bOpen.centeredX, 294);
            assertEqual('Test 175.9: minX equals centeredX with sidebar open', bOpen.minX, 294);
            assertEqual('Test 175.10: maxX equals centeredX with sidebar open', bOpen.maxX, 294);

            const treeCenterOpen = bOpen.centeredX + bOpen.scaledW / 2;
            const viewportCenterOpen = bOpen.TIMELINE_WIDTH + bOpen.usableContW / 2;
            assertEqual('Test 175.11: Tree visual center strictly equals reduced viewport center with sidebar', treeCenterOpen, viewportCenterOpen);

            // 175.3: Dynamic sidebar resizing (sidebarWidth = 480)
            // EffectiveContW = 1200 - 480 = 720px. Usable = 720 - 48 = 672px.
            const bResized = simulateCanvasBounds({
                windowWidth: 1200,
                isSidebarOpen: true,
                sidebarWidth: 480,
                treeW: 300,
                z: 1.0
            });
            assertEqual('Test 175.12: Usable width after sidebar resize to 480px', bResized.usableContW, 672);
            assertEqual('Test 175.13: Centered X after sidebar resize is 234', bResized.centeredX, 234);
            const treeCenterResized = bResized.centeredX + bResized.scaledW / 2;
            const viewportCenterResized = bResized.TIMELINE_WIDTH + bResized.usableContW / 2;
            assertEqual('Test 175.14: Tree center matches resized viewport midpoint', treeCenterResized, viewportCenterResized);

            // 175.4: Camera clamping corrects legacy 56px pin bug
            const clampedFromPin = clampSimulatedCamera({ x: 56, y: 16, z: 1.0 }, bOpen);
            assertEqual('Test 175.15: Clamping legacy 56px position restores centered position (294)', clampedFromPin.x, 294);

            // 175.5: Wide tree panning bounds (tree wider than viewport)
            // treeW = 1600, z = 0.8 => scaledW = 1280. contW = 840, usable = 792.
            const bWide = simulateCanvasBounds({
                windowWidth: 1200,
                isSidebarOpen: true,
                sidebarWidth: 360,
                treeW: 1600,
                z: 0.8
            });
            assert('Test 175.16: Wide tree scaled width exceeds usable container width', bWide.scaledW > bWide.usableContW);
            // minX = contW - scaledW - paddingX = 840 - 1280 - 8 = -448

            // 175.10: Wide tree preserves individual person framing when tree exceeds display port
            const framedWideTree = simComputeFramedCamera({

    // ══════════════════════════════════════════════════════════════════════════
    //  Section 181: A4 Landscape Multi-Page SVG Printing & 10pt Font Scaling
    // ══════════════════════════════════════════════════════════════════════════
    section('181. Section 181: A4 Landscape Multi-Page SVG Printing & 10pt Font Scaling');
    {
        try {
            // Test 181.01 - 181.09: Grid slicing & scale factor calibration
            const rows181A = [
                { ID: '1', Name: 'Patriarch', Gender: 'M', Yob: '1900' },
                { ID: '2', Name: 'Matriarch', Gender: 'F', Spouse: 'Patriarch', Yob: '1905' },
                { ID: '3', Name: 'Eldest Son', Gender: 'M', Father: 'Patriarch', Mother: 'Matriarch', Yob: '1930' },
                { ID: '4', Name: 'Youngest Daughter', Gender: 'F', Father: 'Patriarch', Mother: 'Matriarch', Yob: '1935' }
            ];
            const tree181A = buildTree(rows181A);
            const grid181A = A4PrintComposer.computeA4PrintGrid(tree181A, {}, {
                targetFontSizePt: 10,
                baseFontSizePx: 11
            });

            // Target font size is 10pt. 10pt in px = 10 * (96 / 72) = 13.3333px.
            // Base font size on canvas is 11px.
            // Scale = (10 * 96 / 72) / 11 = 40 / 33 ~= 1.2121212.
            const expectedScale = (10 * (96 / 72)) / 11;
            assert('Test 181.01: Scale factor scales 11px name to 10pt font on physical print', Math.abs(grid181A.scale - expectedScale) < 0.0001);
            assertEqual('Test 181.02: Printable dimensions account for margins (297-20=277mm)', grid181A.printableWidthMm, 277);
            assertEqual('Test 181.03: Printable height accounts for margins (210-20=190mm)', grid181A.printableHeightMm, 190);

            // Check tile width & height in canvas user units
            const printableWidthPx = 277 * (96 / 25.4);
            const printableHeightPx = 190 * (96 / 25.4);
            const expectedTileWidth = printableWidthPx / expectedScale;
            const expectedTileHeight = printableHeightPx / expectedScale;
            assert('Test 181.04: Tile width in canvas units matches printable width / scale', Math.abs(grid181A.tileWidthPx - expectedTileWidth) < 0.01);
            assert('Test 181.05: Tile height in canvas units matches printable height / scale', Math.abs(grid181A.tileHeightPx - expectedTileHeight) < 0.01);

            // Small tree fits within A4 landscape pages
            assert('Test 181.06: Compact tree generates at least 1 tile', grid181A.tiles.length >= 1);
            assertEqual('Test 181.07: First tile starts at page index 1', grid181A.tiles[0].pageIndex, 1);
            assertEqual('Test 181.08: First tile is row 0', grid181A.tiles[0].row, 0);
            assertEqual('Test 181.09: First tile is col 0', grid181A.tiles[0].col, 0);

            // Test 181.10 - 181.14: Wide tree multi-page partitioning
            const rows181B = [
                { ID: '10', Name: 'Great Ancestor', Gender: 'M', Yob: '1880' }
            ];
            // Add 15 children to create a wide horizontal tree spanning multiple A4 landscape sheets
            for (let i = 1; i <= 15; i++) {
                rows181B.push({
                    ID: String(10 + i),
                    Name: `Child Number ${i} Long Family Branch`,
                    Gender: i % 2 === 0 ? 'M' : 'F',
                    Father: 'Great Ancestor',
                    Yob: String(1905 + i * 2)
                });
            }
            const tree181B = buildTree(rows181B);
            const grid181B = A4PrintComposer.computeA4PrintGrid(tree181B, {}, {
                targetFontSizePt: 10,
                baseFontSizePx: 11
            });
            assert('Test 181.10: Wide tree spans multiple columns of A4 sheets', grid181B.cols > 1);
            assert('Test 181.11: Multi-page tiles generated for wide tree', grid181B.tiles.length > 1);
            const indices = grid181B.tiles.map(t => t.pageIndex);
            for (let i = 0; i < indices.length; i++) {
                assertEqual(`Test 181.12: Tile ${i} page index is sequential`, indices[i], i + 1);
            }
            const vbMatch = grid181B.tiles[0].viewBox.split(' ').map(Number);
            assertEqual('Test 181.13: Tile viewBox has 4 components', vbMatch.length, 4);
            assert('Test 181.14: Tile viewBox width matches tileWidthPx', Math.abs(vbMatch[2] - grid181B.tileWidthPx) < 0.2);

            // Test 181.15 - 181.18: Pure SVG generation
            const svgResult = SvgTreeRenderer.generatePureSvgTree(tree181A, {}, {
                targetFontSizePt: 10,
                baseFontSizePx: 11
            });
            assert('Test 181.15: generatePureSvgTree returns valid SVG string', typeof svgResult.svg === 'string' && svgResult.svg.startsWith('<svg'));
            assert('Test 181.16: generatePureSvgTree innerSvg contains person nodes', svgResult.innerSvg.includes('class="person-node"'));
            assert('Test 181.17: SVG includes person name text', svgResult.innerSvg.includes('Patriarch') && svgResult.innerSvg.includes('Matriarch'));
            assert('Test 181.18: SVG includes connector paths or groups', svgResult.innerSvg.includes('tree-connectors') || svgResult.innerSvg.includes('<path'));

            // Test 181.19 - 181.24: buildPrintableA4Html output validation
            const printableHtml = A4PrintComposer.buildPrintableA4Html(tree181B, {}, {
                title: 'Great Ancestor Lineage'
            });
            assert('Test 181.19: buildPrintableA4Html produces full HTML5 document', printableHtml.includes('<!DOCTYPE html>') && printableHtml.includes('</html>'));
            assert('Test 181.20: Printable HTML contains A4 landscape print CSS', printableHtml.includes('size: A4 landscape') || printableHtml.includes('size: 297mm 210mm'));
            assert('Test 181.21: Printable HTML contains print button / toolbar', printableHtml.includes('window.print()'));
            assert('Test 181.22: Printable HTML contains a4-sheet sections for each page', printableHtml.includes('class="a4-sheet"'));
            assert('Test 181.23: Title is embedded in sheet headers and footers', printableHtml.includes('Great Ancestor Lineage'));
            assert('Test 181.24: Scale calibration note is included in footer', printableHtml.includes('10pt names on A4 Landscape'));

            // Test 181.25 - 181.26: buildPrintableA4HtmlFromSvg for raw SVG strings
            const mockRawSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200" width="2000" height="1200"><rect x="100" y="100" width="90" height="76" fill="#e0f2fe"/><text x="145" y="130">Sample</text></svg>`;
            const fromSvgHtml = A4PrintComposer.buildPrintableA4HtmlFromSvg(mockRawSvg, {
                title: 'Raw SVG Sliced Tree'
            });
            assert('Test 181.25: buildPrintableA4HtmlFromSvg produces valid HTML', fromSvgHtml.includes('<!DOCTYPE html>') && fromSvgHtml.includes('Raw SVG Sliced Tree'));
            assert('Test 181.26: buildPrintableA4HtmlFromSvg tiles the raw SVG across A4 pages', fromSvgHtml.includes('class="a4-sheet"'));
        } catch (e) {
            assertEqual('Test 181 execution failed', e.message, '');
        }
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  183. Subtree Collapse & Expand Button Visibility (hasChildren & isCollapsed)
    // ══════════════════════════════════════════════════════════════════════════
    section('183. Subtree Collapse & Expand Button Visibility (hasChildren & isCollapsed)');

    // 183A: Single-spouse branch collapse preserves hasChildren and sets isCollapsed for (+) button rendering
    {
        try {
            const rows183 = [
                { _sourceId: 's1', _sheetRow: 1, Name: 'Babu', Gender: 'M', 'Year of Birth': '1955', Spouse: 'Celine' },
                { _sourceId: 's1', _sheetRow: 2, Name: 'Celine', Gender: 'F', 'Year of Birth': '1960', Spouse: 'Babu' },
                { _sourceId: 's1', _sheetRow: 3, Name: 'Jomon', Gender: 'M', Father: 'Babu', Mother: 'Celine', 'Year of Birth': '1985' },
                { _sourceId: 's1', _sheetRow: 4, Name: 'Deepu', Gender: 'M', Father: 'Babu', Mother: 'Celine', 'Year of Birth': '1990' },
                { _sourceId: 's1', _sheetRow: 5, Name: 'Eileen', Gender: 'F', Father: 'Jomon', 'Year of Birth': '2015' }
            ];

            const tree183 = buildTree(rows183);
            const babu = tree183.all.find(n => n.name === 'Babu');
            const celine = tree183.all.find(n => n.name === 'Celine');
            const jomon = tree183.all.find(n => n.name === 'Jomon');
            const deepu = tree183.all.find(n => n.name === 'Deepu');
            const eileen = tree183.all.find(n => n.name === 'Eileen');

            assert('Test 183.01: Babu profile exists', !!babu);
            assert('Test 183.01: Celine profile exists', !!celine);
            assert('Test 183.01: Jomon profile exists', !!jomon);

            // Case 1: Uncollapsed state
            const uncollapsedConfig = {
                collapsedNodes: new Set(),
                visibleNodes: tree183.getVisibleNodes(new Set()),
                rootNodeYob: tree183.getStats().rootNodeYob,
                ppy: 2.5
            };

            const uncollapsedSub = layoutSubtree(babu, tree183, uncollapsedConfig, new Set());
            const uncollapsedData = flattenTreeLayout(uncollapsedSub);

            const babuUncollapsed = uncollapsedData.nodes.find(n => n.person.id === babu.id);
            const celineUncollapsed = uncollapsedData.nodes.find(n => n.person.id === celine.id);
            const jomonUncollapsed = uncollapsedData.nodes.find(n => n.person.id === jomon.id);
            const deepuUncollapsed = uncollapsedData.nodes.find(n => n.person.id === deepu.id);
            const eileenUncollapsed = uncollapsedData.nodes.find(n => n.person.id === eileen.id);

            assert('Test 183.02: Babu is rendered uncollapsed', !!babuUncollapsed);
            assertEqual('Test 183.03: Babu hasChildren is true uncollapsed', babuUncollapsed.hasChildren, true);
            assertEqual('Test 183.04: Babu isCollapsed is false uncollapsed', babuUncollapsed.isCollapsed, false);
            assert('Test 183.05: Jomon is rendered uncollapsed', !!jomonUncollapsed);
            assert('Test 183.06: Deepu is rendered uncollapsed', !!deepuUncollapsed);
            assert('Test 183.07: Eileen is rendered uncollapsed', !!eileenUncollapsed);
            assert('Test 183.08: Parent connector paths exist when uncollapsed', uncollapsedData.paths.some(p => p.type === 'parent-stem'));

            // Case 2: Collapsed state (user clicked (-) on Babu)
            const collapsedConfig = {
                collapsedNodes: new Set([babu.id]),
                visibleNodes: tree183.getVisibleNodes(new Set([babu.id])),
                rootNodeYob: tree183.getStats().rootNodeYob,
                ppy: 2.5
            };

            const collapsedSub = layoutSubtree(babu, tree183, collapsedConfig, new Set());
            const collapsedData = flattenTreeLayout(collapsedSub);

            const babuCollapsed = collapsedData.nodes.find(n => n.person.id === babu.id);
            const celineCollapsed = collapsedData.nodes.find(n => n.person.id === celine.id);
            const jomonCollapsed = collapsedData.nodes.find(n => n.person.id === jomon.id);
            const deepuCollapsed = collapsedData.nodes.find(n => n.person.id === deepu.id);
            const eileenCollapsed = collapsedData.nodes.find(n => n.person.id === eileen.id);

            assert('Test 183.09: Babu is still rendered when collapsed', !!babuCollapsed);
            assert('Test 183.10: Celine is still rendered when collapsed', !!celineCollapsed);
            assertEqual('Test 183.11: Babu hasChildren is TRUE when collapsed (renders collapse button)', babuCollapsed.hasChildren, true);
            assertEqual('Test 183.12: Babu isCollapsed is TRUE when collapsed (renders (+) expand icon)', babuCollapsed.isCollapsed, true);

            assert('Test 183.13: Jomon is hidden when Babu is collapsed', !jomonCollapsed);
            assert('Test 183.14: Deepu is hidden when Babu is collapsed', !deepuCollapsed);
            assert('Test 183.15: Eileen is hidden when Babu is collapsed', !eileenCollapsed);

            // Connectors to children should not exist when collapsed
            assertEqual('Test 183.16: No parent-stem connectors when collapsed', collapsedData.paths.filter(p => p.type === 'parent-stem').length, 0);
            assertEqual('Test 183.17: No bus-bar connectors when collapsed', collapsedData.paths.filter(p => p.type === 'bus-bar').length, 0);

            // Case 3: Multi-spouse collapse scenario
            const rows183MS = [
                { _sourceId: 's1', _sheetRow: 1, Name: 'Joseph', Gender: 'M', 'Year of Birth': '1920' },
                { _sourceId: 's1', _sheetRow: 2, Name: 'Kochuthresia', Gender: 'F', 'Year of Birth': '1922', Spouse: 'Joseph' },
                { _sourceId: 's1', _sheetRow: 3, Name: 'Thankamma', Gender: 'F', 'Year of Birth': '1929', Spouse: 'Joseph' },
                { _sourceId: 's1', _sheetRow: 4, Name: 'KChild1', Gender: 'M', Father: 'Joseph', Mother: 'Kochuthresia', 'Year of Birth': '1945' },
                { _sourceId: 's1', _sheetRow: 5, Name: 'TChild1', Gender: 'M', Father: 'Joseph', Mother: 'Thankamma', 'Year of Birth': '1955' }
            ];

            const tree183MS = buildTree(rows183MS);
            const kochu = tree183MS.all.find(n => n.name === 'Kochuthresia');
            const thanka = tree183MS.all.find(n => n.name === 'Thankamma');
            const joseph = tree183MS.all.find(n => n.name === 'Joseph');

            // Collapse Kochuthresia only
            const msCollapsedConfig = {
                collapsedNodes: new Set([kochu.id]),
                visibleNodes: tree183MS.getVisibleNodes(new Set([kochu.id])),
                rootNodeYob: tree183MS.getStats().rootNodeYob,
                ppy: 2.5

            const msSub = layoutSubtree(joseph, tree183MS, msCollapsedConfig, new Set());
            const msData = flattenTreeLayout(msSub);

    // ══════════════════════════════════════════════════════════════════════════
    //  184. Subtree Collapse & Expand Camera Anchor Stability (No Jerky Sideways Motion)
    // ══════════════════════════════════════════════════════════════════════════
    section('184. Subtree Collapse & Expand Camera Anchor Stability (No Jerky Sideways Motion)');

    // 184A: Direct Camera Anchoring Shift
    {
        try {
            // Simulate anchoring calculation when collapsing a subtree
            // User clicks (-) on a card at screen position targetX = 520, targetY = 240
            // Initial camera: { x: 180, y: 80, z: 1.0 }
            const startRect = { left: 470, top: 200, width: 100, height: 80 };
            const targetX = startRect.left + startRect.width / 2; // 520
            const targetY = startRect.top + startRect.height / 2; // 240

            // After subtree collapse DOM re-layout, the uncompensated card is at:
            const currentRect = { left: 390, top: 200, width: 100, height: 80 };
            const currentX = currentRect.left + currentRect.width / 2; // 440
            const currentY = currentRect.top + currentRect.height / 2; // 240

            const dx = targetX - currentX; // +80px
            const dy = targetY - currentY; // 0px

            assertEqual('Test 184.01: Horizontal anchor compensation dx is +80px', dx, 80);
            assertEqual('Test 184.02: Vertical anchor compensation dy is 0px', dy, 0);

            // Direct offset application (without clampCamera overriding)
            const initialCam = { x: 180, y: 80, z: 1.0 };
            const updatedCam = { ...initialCam, x: initialCam.x + dx, y: initialCam.y + dy };

            assertEqual('Test 184.03: Directly shifted camera.x preserves anchor offset (260)', updatedCam.x, 260);
            assertEqual('Test 184.04: Directly shifted camera.y preserves vertical position (80)', updatedCam.y, 80);

            // Verify the card's resulting screen position after camera shift
            // Screen position shifts exactly by dx: 440 + 80 = 520px
            const compensatedScreenX = currentX + dx;
            assertEqual('Test 184.05: Compensated card screen coordinate exactly equals targetX', compensatedScreenX, targetX);

            // Demonstration of why clampCamera caused the jerky sideways jump:
            // Suppose the collapsed tree width fits in viewport, so centeredX is 110px.
            // With clampCamera, minX = maxX = 110.
            const simulatedCenteredX = 110;
            const clampedCamX = simulatedCenteredX;
            const clampedScreenX = currentX + (clampedCamX - initialCam.x);
            const clampDisplacement = Math.abs(clampedScreenX - targetX);
            assertEqual('Test 184.06: clampCamera would displace card by 150px away from pointer', clampDisplacement, 150);

            // Sub-pixel threshold check: shifts <= 0.5px should not trigger camera changes
            const subpixelDx = 0.3;
            const subpixelDy = 0.2;
            const shouldShift = Math.abs(subpixelDx) > 0.5 || Math.abs(subpixelDy) > 0.5;
            assertEqual('Test 184.07: Sub-pixel shifts under 0.5px are ignored to prevent micro-jitter', shouldShift, false);
        } catch (e) {
            assertEqual('Test 184A execution failed', e.message, '');
        }
    }

    // 184B: Code Invariants for Transition Suppression and ResizeObserver Protection
    {
        try {
            // Verify that useLayoutEffect applies direct camera offset without clampCamera
            assert('Test 184.08: useLayoutEffect sets camera with direct { ...cam, x: cam.x + dx, y: cam.y + dy }',
                source.includes('setCamera(cam => ({ ...cam, x: cam.x + dx, y: cam.y + dy }))'));

            // Verify that clampCamera is NOT called during collapse/expand anchor adjustment
            assert('Test 184.09: useLayoutEffect does not pass anchor shift into clampCamera',
                !source.includes('setCamera(cam => clampCamera({ ...cam, x: cam.x + dx, y: cam.y + dy }))'));

            // Verify double requestAnimationFrame is used to suppress transitions while updating camera
            assert('Test 184.10: setIsShifting(false) is deferred via double requestAnimationFrame',
                source.includes('requestAnimationFrame(() => {\n            requestAnimationFrame(() => {\n                setIsShifting(false);'));

            // Verify that ResizeObserver only re-clamps camera on container resize, not on treeRef resize
            assert('Test 184.11: ResizeObserver checks isContainerResize before re-clamping camera',
                source.includes('const isContainerResize = !entries || entries.some(entry => entry.target === containerRef.current);'));

            // Verify that missing nodeEl safely clears isShifting state immediately
            assert('Test 184.12: Missing nodeEl safely resets isShifting to prevent stuck transitions',
                source.includes('if (!nodeEl) {\n            setIsShifting(false);\n            return;\n        }'));
        } catch (e) {
            assertEqual('Test 184B execution failed', e.message, '');
        }
    }
