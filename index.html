      console.error('Global window error captured:', event.error || event.message);
      const rootEl = document.getElementById('root');
      if (rootEl && (!window.__FT_APP_MOUNTED__ || !rootEl.children || rootEl.children.length === 0)) {
        rootEl.innerHTML = `
          <div class="flex items-center justify-center h-full p-8 font-sans">
            <div class="max-w-2xl bg-red-50 border border-red-200 text-red-700 p-6 rounded-2xl shadow-lg">
              <h2 class="text-lg font-bold mb-2">Uncaught Application Error</h2>
              <pre class="text-xs font-mono whitespace-pre-wrap overflow-auto max-h-96">${event.error?.stack || event.message || String(event)}</pre>
            </div>
          </div>
        `;
      }
    });

    window.addEventListener('unhandledrejection', function(event) {
      console.error('Unhandled promise rejection:', event.reason);
    });

    function loadScriptFallback(src) {
      return new Promise(function(resolve, reject) {
        var s = document.createElement('script');
        s.src = src;
        s.crossOrigin = 'anonymous';
        s.onload = resolve;
        s.onerror = function() { reject(new Error('Failed to load ' + src)); };
        document.head.appendChild(s);
      });
    }

    async function ensureReactGlobals() {
      if (!window.React) {
        await loadScriptFallback('https://unpkg.com/react@18.3.1/umd/react.production.min.js');
      }
      if (!window.ReactDOM) {
        await loadScriptFallback('https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js');
      }
    }

    async function loadCompiledOrFallbackCode() {
      var pre = window.__FT_BUNDLE_FETCH__ ? await window.__FT_BUNDLE_FETCH__ : null;
      if (pre) return pre;
      var bundleUrl = './App.compiled.js?v=' + encodeURIComponent(window.FT_APP_BUNDLE_VERSION || '1');
      var res = await fetch(bundleUrl);
      if (res.ok) return await res.text();
      // Dev fallback if App.compiled.js was not built yet
      window.__FT_SET_BOOT_STATUS__('Compiling application source…');
      if (!window.Babel) {
        await loadScriptFallback('https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js');
      }
      var jsxRes = await fetch('./App.jsx');
      if (!jsxRes.ok) throw new Error('Failed to load App.jsx: ' + jsxRes.statusText);
      var jsxCode = await jsxRes.text();
      return window.Babel.transform(jsxCode, { presets: ['react', 'env'], filename: 'App.jsx' }).code;
    }

    async function loadApp() {
      try {
        await ensureReactGlobals();
        const compiledCode = await loadCompiledOrFallbackCode();
        if (window.__FT_SET_BOOT_STATUS__) window.__FT_SET_BOOT_STATUS__('Starting interface…');

        // React Error Boundary to catch render lifecycle and hook errors
        class RootErrorBoundary extends window.React.Component {
          constructor(props) {
            super(props);
            this.state = { hasError: false, error: null };
          }

            return { hasError: true, error };
          }
          componentDidCatch(error, errorInfo) {
            console.error('RootErrorBoundary caught component error:', error, errorInfo);
          }
          render() {
            if (this.state.hasError) {
              return window.React.createElement('div', { className: 'flex items-center justify-center h-full p-8 font-sans' },
                window.React.createElement('div', { className: 'max-w-2xl bg-red-50 border border-red-200 text-red-700 p-6 rounded-2xl shadow-lg' },
                  window.React.createElement('h2', { className: 'text-lg font-bold mb-2' }, 'Runtime Error in Family Tree Application'),
                  window.React.createElement('pre', { className: 'text-xs font-mono whitespace-pre-wrap overflow-auto max-h-96' },
                    this.state.error?.stack || this.state.error?.message || String(this.state.error)
                  )
                )

            }
            return this.props.children;
          }
        }

        const moduleFunc = new Function('React', 'ReactDOM', 'exports', 'module', 'require', compiledCode);
        const localExports = {};
        const localModule = { exports: localExports };
        moduleFunc(window.React, window.ReactDOM, localExports, localModule, window.require);

        const AppComponent = localModule.exports.default || localExports.default || window.App;
        if (!AppComponent) {

        }

        window.__FT_APP_MOUNTED__ = true;
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(window.React.createElement(RootErrorBoundary, null, window.React.createElement(AppComponent)));
      } catch (err) {
        console.error('Error initializing Family Tree app:', err);
        document.getElementById('root').innerHTML = `
          <div class="flex items-center justify-center h-full p-8 font-sans">
            <div class="max-w-xl bg-red-50 border border-red-200 text-red-700 p-6 rounded-2xl shadow-lg">
              <h2 class="text-lg font-bold mb-2">Error Loading Application</h2>
              <pre class="text-xs font-mono whitespace-pre-wrap overflow-auto max-h-96">${err.message}</pre>
            </div>
          </div>
        `;
      }
    }
    loadApp();
  </script>
