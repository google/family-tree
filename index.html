  <div id="root" class="h-full w-full"></div>

  <!-- Dynamic loader for App.jsx that transforms JSX + ES Modules using Babel and mounts the React root -->
  <script type="text/javascript">
    // Provide standard CommonJS / module environment for Babel transpiled code
    window.exports = window.exports || {};
    window.module = window.module || { exports: window.exports };
    window.require = function(moduleName) {
      if (moduleName === 'react') return window.React;
      if (moduleName === 'react-dom' || moduleName === 'react-dom/client') return window.ReactDOM;
      throw new Error('Cannot find module "' + moduleName + '"');
    };

    // Global error listener to surface uncaught script errors in the UI
    window.addEventListener('error', function(event) {
      console.error('Global window error captured:', event.error || event.message);
      const rootEl = document.getElementById('root');
      if (rootEl && (!rootEl.children || rootEl.children.length === 0 || rootEl.innerHTML.trim() === '')) {
        rootEl.innerHTML = `
          <div class="flex items-center justify-center h-full p-8 font-sans">
            <div class="max-w-2xl bg-red-50 border border-red-200 text-red-700 p-6 rounded-2xl shadow-lg">
              <h2 class="text-lg font-bold mb-2">Uncaught Application Error</h2>
              <pre class="text-xs font-mono whitespace-pre-wrap overflow-auto max-h-96">${event.error?.stack || event.message || String(event)}</pre>
            </div>
          </div>
        `;
      }
    });

    // Global unhandled promise rejection listener
    window.addEventListener('unhandledrejection', function(event) {
      console.error('Unhandled promise rejection:', event.reason);
    });

    // React Error Boundary to catch render lifecycle and hook errors
    class RootErrorBoundary extends window.React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error('RootErrorBoundary caught component error:', error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return window.React.createElement('div', { className: 'flex items-center justify-center h-full p-8 font-sans' },
            window.React.createElement('div', { className: 'max-w-2xl bg-red-50 border border-red-200 text-red-700 p-6 rounded-2xl shadow-lg' },
              window.React.createElement('h2', { className: 'text-lg font-bold mb-2' }, 'Runtime Error in Family Tree Application'),
              window.React.createElement('pre', { className: 'text-xs font-mono whitespace-pre-wrap overflow-auto max-h-96' },
                this.state.error?.stack || this.state.error?.message || String(this.state.error)
              )
            )
          );
        }
        return this.props.children;
      }
    }

    async function loadApp() {
      try {
        const response = await fetch('./App.jsx?t=' + Date.now());
        if (!response.ok) throw new Error('Failed to load App.jsx: ' + response.statusText);
        const code = await response.text();

        // Transpile ES modules + React JSX directly using Babel
        const transformed = Babel.transform(code, {
          presets: ['react', 'env'],
          filename: 'App.jsx'
        }).code;

        // Execute in an isolated function scope with exports/require passed in
        const moduleFunc = new Function('React', 'ReactDOM', 'exports', 'module', 'require', transformed);
        const localExports = {};
        const localModule = { exports: localExports };
        moduleFunc(window.React, window.ReactDOM, localExports, localModule, window.require);

        const AppComponent = localModule.exports.default || localExports.default || window.App;
        if (!AppComponent) {
          throw new Error('App component was not exported from App.jsx');
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(window.React.createElement(RootErrorBoundary, null, window.React.createElement(AppComponent)));
      } catch (err) {
        console.error('Error initializing Family Tree app:', err);
        document.getElementById('root').innerHTML = `
          <div class="flex items-center justify-center h-full p-8 font-sans">
            <div class="max-w-xl bg-red-50 border border-red-200 text-red-700 p-6 rounded-2xl shadow-lg">
              <h2 class="text-lg font-bold mb-2">Error Loading Application</h2>
              <pre class="text-xs font-mono whitespace-pre-wrap overflow-auto max-h-96">${err.message}</pre>
            </div>
          </div>
        `;
      }
    }
    loadApp();
  </script>
